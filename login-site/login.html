<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    
    <main class="container">
        <form id="loginForm">
            <h2>Login</h2>

            <label for="email">Email</label>
            <input type="email" id="email" name="E-email" placeholder="Email" required>
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Senha" required>

            <button type="submit">Entrar</button>

            <p id="message"></p>

            <p><a href="Registro.html">Criar conta</a></p>

        </form>
    </main>
    <script src="scripts/app-local.js"></script>
</body>
</html>
